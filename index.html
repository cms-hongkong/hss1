<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>責任感特工大行動 - 實景背景版</title>
  <style>
    :root {
      --primary-dark: #2E7D32;
      --secondary: #FF9800;
    }

    * { box-sizing: border-box; font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; }
    body { background-color: #C8E6C9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }

    header {
      background: var(--primary-dark); color: white; width: 100%; max-width: 900px;
      text-align: center; padding: 15px 0; border-radius: 16px 16px 0 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { margin: 0; font-size: 24px; }

    /* 遊戲主體容器 */
    .container {
      max-width: 900px; width: 100%; background: white; padding: 0;
      border-radius: 0 0 16px 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border: 4px solid var(--primary-dark); border-top: none; text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部狀態列 */
    .stats-bar {
      display: flex; justify-content: space-around; background: rgba(255,255,255,0.9); padding: 10px;
      font-size: 18px; font-weight: bold; color: #333; z-index: 10; position: relative;
      border-bottom: 2px solid #E0E0E0;
    }

    /* 🎮 遊戲場景區域 */
    .game-area {
      position: relative;
      width: 100%;
      height: 520px; /* 完美匹配 4:3 背景圖片比例 */
      background-color: #f0f0f0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 👻 隱形感應區 (Drop Zones) - 預設帶有白色半透明虛線框，方便你測試測試 */
    .drop-zone {
      position: absolute;
      border: 3px dashed rgba(255, 255, 255, 0.7);
      border-radius: 15px;
      z-index: 5;
      transition: all 0.2s;
    }
    .drop-zone.drag-over {
      background-color: rgba(76, 175, 80, 0.35);
      border: 3px dashed #4CAF50;
    }

    /* 待分類物品池 (擺放在畫面偏上方空位) */
    .items-pool {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      padding: 10px;
      z-index: 10;
    }

    .item-card {
      background: rgba(255, 255, 255, 0.95); padding: 6px; border-radius: 12px; cursor: grab; user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; flex-direction: column;
      align-items: center; width: 85px; border: 2px solid transparent; transition: all 0.2s;
    }
    .item-card:hover { transform: translateY(-3px) scale(1.05); }
    .item-card.selected { border: 3px solid #2196F3; transform: scale(1.08); }
    .item-card img { width: 55px; height: 55px; object-fit: contain; pointer-events: none; }
    .item-name { font-size: 13px; font-weight: bold; color: #333; pointer-events: none; margin-top: 3px; }

    /* 答錯震動動畫 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); border-color: red; }
      50% { transform: translateX(5px); border-color: red; }
      75% { transform: translateX(-5px); border-color: red; }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* 按鈕樣式 */
    .btn { background: var(--secondary); color: white; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .btn:hover { transform: scale(1.05); }

    .screen { padding: 40px 20px; }
    .hidden { display: none !important; }
    
    /* 第二關課表提示字樣 */
    .level-prompt {
      position: absolute;
      top: 130px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #D32F2F;
      text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
      z-index: 8;
      pointer-events: none;
    }
    .highlight-tag {
      background: #FFCDD2;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-block;
      margin: 2px 0;
    }
  </style>
</head>
<body>

<header>
  <h1>🕵🏻‍♂️ 責任感特工大行動</h1>
</header>

<div class="container">
  <!-- 主選單 -->
  <div id="menu-screen" class="screen">
    <h2 style="color:var(--primary-dark); font-size: 32px; margin-bottom: 20px;">特工任務準備就緒！</h2>
    <p style="font-size: 18px; margin-bottom: 30px;">請幫助咕嚕完成整理座位及執書包的考驗！</p>
    <button class="btn" onclick="startLevel(0)">🚀 開始執行任務</button>
  </div>

  <!-- 遊戲主畫面 -->
  <div id="game-screen" class="hidden">
    <div class="stats-bar">
      <div>關卡: <span id="current-level-txt">1/2</span></div>
      <div>任務: <span id="mission-txt" style="color:#1565C0;">物品大分類</span></div>
      <div>積分: <span id="score-txt" style="color:#D32F2F;">0</span></div>
    </div>

    <!-- 遊戲互動區 -->
    <div class="game-area" id="game-area">
      <!-- 提示文字 (第二關用) -->
      <div id="level-prompt" class="level-prompt"></div>

      <!-- 待分類物品池 -->
      <div id="items-pool" class="items-pool"></div>

      <!-- 👻 隱形感應區 (座標會根據關卡由 JS 動態精準套用) -->
      <div class="drop-zone" id="zone-bag" data-type="bag" onclick="handleTargetClick('bag')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'bag')" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
      <div class="drop-zone" id="zone-trash" data-type="trash" onclick="handleTargetClick('trash')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'trash')" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
      <div class="drop-zone" id="zone-home" data-type="home" onclick="handleTargetClick('home')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'home')" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
    </div>
  </div>

  <!-- 通關結算 -->
  <div id="game-over-screen" class="screen hidden">
    <h2 style="color:var(--primary-dark); font-size: 36px;">🎉 任務完成！</h2>
    <p style="font-size: 24px; margin: 20px 0;">最終得分：<span id="final-score" style="color:var(--secondary); font-weight:bold;">0</span> 分</p>
    <div style="background:#FFE082; padding:15px; border-radius:10px; font-weight:bold; color:#D84315; font-size:24px; margin:20px auto; max-width:400px;">
      「自己的事，自己做！」
    </div>
    <button class="btn" onclick="location.reload()">🔄 重新開始</button>
  </div>
</div>

<script>
  // 🎮 遊戲關卡資料庫
  const LEVELS_DATA = [
    {
      title: "第一關：物品大分類",
      bgImage: "bg_level1.jpg", // 對應你上傳的 1.jpg（有咕嚕、書包、玩具箱、垃圾桶）
      mode: "sorting",
      items: [
        { id: "book", name: "人文書", img: "item_book.png", type: "bag" },
        { id: "music", name: "音樂書", img: "item_music.png", type: "bag" },
        { id: "stationery", name: "文具", img: "item_stationery.png", type: "bag" },
        { id: "plush", name: "毛公仔", img: "item_plush.png", type: "home" },
        { id: "robot", name: "機械人", img: "item_robot.png", type: "home" },
        { id: "car", name: "玩具車", img: "item_car.png", type: "home" },
        { id: "paper", name: "廢紙", img: "item_paper.png", type: "trash" },
        { id: "candy", name: "垃圾糖紙", img: "item_candy.png", type: "trash" },
        { id: "banana", name: "蕉皮", img: "item_banana.png", type: "trash" }
      ]
    },
    {
      title: "第二關：按表執書包",
      bgImage: "bg_level2.jpg", // 對應你上傳的 2.jpg（只有正中間的空白書包）
      mode: "packing",
      promptHtml: "明日課表：<br><span class='highlight-tag'>上人文課</span><br><span class='highlight-tag'>上體育課</span><br><span style='font-size:16px; color:#333;'>請把需要的物品放入書包</span>",
      items: [
        { id: "book", name: "人文書", img: "item_book.png", type: "bag" },
        { id: "pe_uniform", name: "體育服", img: "item_pe.png", type: "bag" },
        { id: "stationery", name: "文具", img: "item_stationery.png", type: "bag" },
        { id: "music", name: "音樂書", img: "item_music.png", type: "home" },
        { id: "school_uniform", name: "校服", img: "item_school_uniform.png", type: "home" },
        { id: "beyblade", name: "爆旋陀螺", img: "item_beyblade.png", type: "home" }
      ]
    }
  ];

  // 🔊 音效產生器
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  // 隨機打亂演算法
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  let currentLvlIdx = 0;
  let score = 0;
  let remainingItems = [];
  let selectedItem = null;

  function showScreen(screenId) {
    ['menu-screen', 'game-screen', 'game-over-screen'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  function startLevel(idx) {
    currentLvlIdx = idx;
    if (idx === 0) score = 0;
    
    showScreen('game-screen');
    const lvl = LEVELS_DATA[idx];
    
    document.getElementById('current-level-txt').innerText = `${idx + 1}/2`;
    document.getElementById('mission-txt').innerText = lvl.title;
    document.getElementById('score-txt').innerText = score;
    
    // 設置背景圖片
    document.getElementById('game-area').style.backgroundImage = `url('${lvl.bgImage}')`;
    document.getElementById('level-prompt').innerHTML = lvl.promptHtml ? lvl.promptHtml : "";

    const zoneBag = document.getElementById('zone-bag');
    const zoneTrash = document.getElementById('zone-trash');
    const zoneHome = document.getElementById('zone-home');

    // 🎯 精準對齊兩張真實圖片的絕對座標設定 (Calibrated Coordinates)
    if (idx === 0) {
      // 對應第一張圖 (1.jpg)：書包左下、玩具箱中下、垃圾桶右下[span_4](start_span)[span_4](end_span)
      zoneBag.style.cssText = "top: 52%; left: 3%; width: 30%; height: 44%; display: block;";
      zoneHome.style.cssText = "top: 68%; left: 47%; width: 28%; height: 28%; display: block;";
      zoneTrash.style.cssText = "top: 60%; left: 79%; width: 19%; height: 36%; display: block;";
    } else {
      // 對應第二張圖 (2.jpg)：書包移至正中間下半部[span_5](start_span)[span_5](end_span)
      zoneBag.style.cssText = "top: 52%; left: 36%; width: 28%; height: 42%; display: block;";
      zoneHome.style.display = "none";
      zoneTrash.style.display = "none";
    }

    remainingItems = shuffleArray([...lvl.items]);
    selectedItem = null;
    document.getElementById('items-pool').innerHTML = '';

    remainingItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.id = `card-${item.id}`;
      card.draggable = true;
      card.innerHTML = `<img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'; this.nextSibling.style.display='block';"><div class="item-name">${item.name}</div>`;
      
      // 點選邏輯 (支援平板/電腦)
      card.onclick = () => {
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedItem = item;
      };

      // 拖拽邏輯
      card.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', item.id);
        selectedItem = item;
      };
      
      document.getElementById('items-pool').appendChild(card);
    });
  }

  function allowDrop(e) { e.preventDefault(); }
  function dragEnter(e) { e.preventDefault(); e.target.classList.add('drag-over'); }
  function dragLeave(e) { e.target.classList.remove('drag-over'); }

  function handleTargetClick(targetType) {
    if (!selectedItem) { alert('請先點選上面的物品！'); return; }
    processAnswer(targetType);
  }

  function handleDrop(e, targetType) {
    e.preventDefault();
    e.target.classList.remove('drag-over');
    const itemId = e.dataTransfer.getData('text/plain');
    const item = remainingItems.find(i => i.id === itemId) || selectedItem;
    if (!item) return;

    selectedItem = item;
    processAnswer(targetType);
  }

  function processAnswer(targetType) {
    const lvl = LEVELS_DATA[currentLvlIdx];
    let isCorrect = false;

    if (lvl.mode === 'sorting') {
        isCorrect = (selectedItem.type === targetType);
    } else if (lvl.mode === 'packing') {
        isCorrect = (selectedItem.type === 'bag' && targetType === 'bag');
    }

    if (isCorrect) {
      playSound('correct');
      score += 10;
      document.getElementById('score-txt').innerText = score;
      
      document.getElementById(`card-${selectedItem.id}`).remove();
      remainingItems = remainingItems.filter(i => i.id !== selectedItem.id);
      selectedItem = null;

      if (lvl.mode === 'sorting' && remainingItems.length === 0) {
          checkLevelComplete();
      } else if (lvl.mode === 'packing' && remainingItems.filter(i => i.type === 'bag').length === 0) {
          checkLevelComplete();
      }
    } else {
      playSound('wrong');
      const cardEl = document.getElementById(`card-${selectedItem.id}`);
      if(cardEl) {
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');
      }
    }
  }

  function checkLevelComplete() {
    setTimeout(() => {
      currentLvlIdx++;
      if (currentLvlIdx < LEVELS_DATA.length) {
        alert('🎉 太棒了！進入下一關！');
        startLevel(currentLvlIdx);
      } else {
        document.getElementById('final-score').innerText = score;
        showScreen('game-over-screen');
      }
    }, 400);
  }
</script>
</body>
</html>
