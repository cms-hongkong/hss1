<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>責任感特工大行動 - 完美向量版</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-dark: #2E7D32;
      --secondary: #FF9800;
      --accent: #FFC107;
      --danger: #F44336;
      --bg: #F1F8E9;
      --text: #37474F;
    }

    * { box-sizing: border-box; font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; }
    body { background-color: #C8E6C9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }

    header {
      background: var(--primary-dark); color: white; width: 100%; max-width: 800px;
      text-align: center; padding: 15px 0; border-radius: 16px 16px 0 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { margin: 0; font-size: 22px; }

    .container {
      max-width: 800px; width: 100%; background: var(--bg); padding: 20px;
      border-radius: 0 0 16px 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border: 4px solid var(--primary-dark); border-top: none; text-align: center;
    }

    .btn {
      background: var(--secondary); color: white; border: none; padding: 12px 24px;
      margin: 8px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .btn-submit { background: var(--primary); font-size: 18px; padding: 12px 30px; }
    .btn-gold { background: var(--accent); color: #333; }
    .btn-circle { background: #4CAF50; font-size: 18px; padding: 15px 30px; }
    .btn-cross { background: #F44336; font-size: 18px; padding: 15px 30px; }

    .stats-bar {
      display: flex; justify-content: space-around; background: white; padding: 10px;
      border-radius: 12px; font-size: 16px; font-weight: bold; color: var(--text);
      margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* 角色與對話框 */
    .hero-avatar { width: 130px; height: 130px; margin: 5px auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
    .speech-bubble {
      background: white; padding: 15px 20px; border-radius: 15px; font-size: 16px; color: var(--text);
      margin: 10px auto 20px; max-width: 480px; box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      border-left: 5px solid var(--primary); text-align: left; line-height: 1.5;
    }

    /* 圖卡風格 (參考 image_8) */
    .items-pool {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
      padding: 15px; border-radius: 15px; margin-bottom: 20px;
    }

    .item-card {
      background: white; padding: 12px; border-radius: 16px; cursor: grab; user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column;
      align-items: center; width: 105px; border: 2px solid transparent; transition: all 0.2s;
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.12); }
    .item-card.selected { border: 3px solid #2196F3; transform: scale(1.05); }
    .item-card svg { width: 65px; height: 65px; pointer-events: none; margin-bottom: 8px; }
    .item-name { font-size: 14px; font-weight: bold; color: #455A64; pointer-events: none; }

    /* 答錯震動動畫 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); border-color: #F44336; }
      50% { transform: translateX(6px); border-color: #F44336; }
      75% { transform: translateX(-6px); border-color: #F44336; }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* 分類目標 */
    .targets-container { display: flex; justify-content: space-around; gap: 15px; width: 100%; margin-bottom: 10px; }
    .target-box {
      flex: 1; background: white; border: 3px dashed #A5D6A7; border-radius: 16px;
      padding: 15px 5px; cursor: pointer; transition: background-color 0.2s;
    }
    .target-box:hover { background: #E8F5E9; border-color: var(--primary); transform: scale(1.02); }
    .target-box svg { width: 55px; height: 55px; pointer-events: none; }
    .target-box h3 { font-size: 16px; color: var(--primary-dark); margin-top: 8px; pointer-events: none;}

    .choice-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .hidden { display: none !important; }

    /* 排行榜 */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden;}
    th, td { padding: 12px; border-bottom: 1px solid #E2E8F0; text-align: center; }
    th { background-color: var(--primary-dark); color: white; }
  </style>
</head>
<body>

<header>
  <h1>🕵🏻‍♂️ 責任感特工大行動</h1>
</header>

<div class="container">
  <!-- 1. 主選單 -->
  <div id="menu-screen">
    <div class="hero-avatar" id="menu-leo-svg"></div>
    <div class="speech-bubble">
      特工你好！我是<b>咕嚕 (Leo)</b>！<br>我有很多不懂的地方，請你通過 3 個關卡的考驗，教我甚麼是<b>「責任感」</b>吧！
    </div>
    <button class="btn btn-submit" onclick="startLevel(0)">🚀 開始特工任務</button> <br>
    <button class="btn btn-gold" onclick="showLeaderboard()">🏆 查看榮譽榜</button>
  </div>

  <!-- 2. 遊戲主畫面 -->
  <div id="game-screen" class="hidden">
    <div class="stats-bar">
      <div>關卡: <span id="current-level-txt">1/3</span></div>
      <div>積分: <span id="score-txt" style="color:var(--secondary);">0</span></div>
      <div id="timer-box" class="hidden" style="color:var(--danger)">⏱️ <span id="timer-txt">30</span>s</div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:15px; margin-bottom:10px;">
      <div style="width:75px; height:75px;" id="game-leo-svg"></div>
      <div class="speech-bubble" id="level-prompt" style="margin:0;">題目讀取中...</div>
    </div>

    <!-- 待分類物品池 -->
    <div id="items-pool" class="items-pool"></div>

    <!-- 分類目標區 -->
    <div id="targets-container" class="targets-container">
      <div class="target-box" id="zone-bag" data-type="bag" onclick="handleTargetClick('bag')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'bag')">
        <div id="target-bag-svg"></div>
        <h3>放進書包</h3>
      </div>
      <div class="target-box" id="zone-trash" data-type="trash" onclick="handleTargetClick('trash')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'trash')">
        <div id="target-trash-svg"></div>
        <h3>丟垃圾桶</h3>
      </div>
      <div class="target-box" id="zone-home" data-type="home" onclick="handleTargetClick('home')" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'home')">
        <div id="target-home-svg"></div>
        <h3>留在屋企</h3>
      </div>
    </div>

    <!-- 第三關：選擇題按鈕 -->
    <div id="choice-container" class="choice-container hidden">
      <button class="btn btn-circle" onclick="handleChoiceClick('circle')">⭕ 有責任感</button>
      <button class="btn btn-cross" onclick="handleChoiceClick('cross')">❌ 沒有責任感</button>
    </div>
  </div>

  <!-- 3. 通關結算 -->
  <div id="game-over-screen" class="hidden">
    <div class="hero-avatar" id="win-leo-svg"></div>
    <h2 style="color:var(--primary-dark);">🎉 任務完成！超級特工！</h2>
    <p style="font-size: 18px; margin: 15px 0;">得分：<span id="final-score" style="color:var(--danger); font-weight:bold; font-size:28px;">0</span> 分</p>
    <div style="background:#FFE082; padding:15px; border-radius:10px; font-weight:bold; color:#D84315; font-size:20px; margin:15px auto; max-width:300px;">
      「自己的事，自己做！」
    </div>
    <input type="text" id="player-name" placeholder="請輸入特工名字" maxlength="10" style="padding:12px; font-size:16px; border-radius:8px; border:2px solid #ccc; width:80%; max-width:250px; text-align:center;"><br>
    <button class="btn btn-submit" style="margin-top:15px;" onclick="saveScore()">儲存紀錄並看排行榜 🏆</button>
  </div>

  <!-- 4. 排行榜 -->
  <div id="leaderboard-screen" class="hidden">
    <h2 style="color:var(--primary-dark);">🏆 責任特工榮譽榜 (Top 10)</h2>
    <table>
      <thead>
        <tr><th>排名</th><th>特工名字</th><th>得分</th></tr>
      </thead>
      <tbody id="leaderboard-tbody"></tbody>
    </table>
    <br><button class="btn" onclick="showScreen('menu-screen')">返回主選單</button>
  </div>
</div>

<script>
  // 🎨 純 SVG 向量圖庫 
  const SVG_LIB = {

    /* 修改：人文科書與音樂書 */
    book: `<svg viewBox="0 0 80 80"><rect x="15" y="10" width="50" height="60" rx="5" fill="#3F51B5"/><rect x="20" y="15" width="40" height="50" rx="2" fill="#E8EAF6"/><text x="40" y="42" font-size="14" font-weight="bold" fill="#1A237E" text-anchor="middle">人文</text><circle cx="40" cy="54" r="4" fill="#FFC107"/></svg>`,

    /* 修改：被壓扁的垃圾糖果紙 */
    candy_trash: `<svg viewBox="0 0 80 80"><path d="M 25 35 Q 35 20 45 30 T 55 35 Q 60 50 45 50 T 25 55 Z" fill="#FFE082" stroke="#F57F17" stroke-width="2"/><path d="M 30 35 L 45 45 M 35 50 L 50 35 M 40 25 L 40 40" stroke="#F57F17" stroke-width="2"/><polygon points="25,40 10,30 15,50" fill="#FFCC80" stroke="#F57F17" stroke-width="1"/><polygon points="55,40 70,30 65,50" fill="#FFCC80" stroke="#F57F17" stroke-width="1"/></svg>`,

    car: `<svg viewBox="0 0 80 80"><path d="M15 45 Q25 25 45 25 Q60 25 70 45 Z" fill="#E53935"/><rect x="10" y="42" width="60" height="16" rx="5" fill="#D32F2F"/><circle cx="25" cy="58" r="8" fill="#263238"/><circle cx="25" cy="58" r="3" fill="#FFF"/><circle cx="55" cy="58" r="8" fill="#263238"/><circle cx="55" cy="58" r="3" fill="#FFF"/></svg>`,
    plush_toy: `<svg viewBox="0 0 80 80"><circle cx="25" cy="25" r="10" fill="#A1887F"/><circle cx="55" cy="25" r="10" fill="#A1887F"/><circle cx="40" cy="45" r="22" fill="#8D6E63"/><circle cx="33" cy="40" r="3" fill="#3E2723"/><circle cx="47" cy="40" r="3" fill="#3E2723"/><ellipse cx="40" cy="52" rx="9" ry="6" fill="#D7CCC8"/><circle cx="40" cy="50" r="2" fill="#3E2723"/><path d="M36 54 Q40 58 44 54" fill="none" stroke="#3E2723" stroke-width="2"/></svg>`,

    bag: `<svg viewBox="0 0 80 80"><rect x="20" y="20" width="40" height="50" rx="8" fill="#42A5F5"/><rect x="28" y="35" width="24" height="28" rx="4" fill="#1E88E5"/><path d="M30 20 C30 10, 50 10, 50 20" fill="none" stroke="#1565C0" stroke-width="4"/><circle cx="40" cy="48" r="4" fill="#FFCA28"/></svg>`,
    trash: `<svg viewBox="0 0 80 80"><rect x="24" y="25" width="32" height="45" rx="3" fill="#90A4AE"/><rect x="20" y="18" width="40" height="7" rx="3" fill="#607D8B"/><line x1="32" y1="33" x2="32" y2="60" stroke="#CFD8DC" stroke-width="3"/><line x1="40" y1="33" x2="40" y2="60" stroke="#CFD8DC" stroke-width="3"/><line x1="48" y1="33" x2="48" y2="60" stroke="#CFD8DC" stroke-width="3"/></svg>`,
    home: `<svg viewBox="0 0 80 80"><rect x="18" y="35" width="44" height="35" fill="#8D6E63"/><polygon points="10,35 40,12 70,35" fill="#5D4037"/><rect x="35" y="48" width="10" height="22" fill="#D7CCC8"/></svg>`,

    /* 關卡 3 專屬情境圖 */
    scene_cross: `<svg viewBox="0 0 160 100"><rect x="10" y="20" width="50" height="40" rx="4" fill="#37474F"/><rect x="14" y="24" width="42" height="32" fill="#81D4FA"/><circle cx="35" cy="75" r="14" fill="#FFCCBC"/><text x="18" y="45" font-size="10">📺</text><circle cx="120" cy="40" r="15" fill="#FFCCBC"/><rect x="100" y="65" width="25" height="30" rx="4" fill="#1E88E5"/><path d="M110 52 L105 70" stroke="#455A64" stroke-width="4"/></svg>`,
    scene_circle1: `<svg viewBox="0 0 160 100"><rect x="100" y="40" width="35" height="50" fill="#78909C"/><path d="M30 80 Q60 30 85 35" fill="none" stroke="#FFCCBC" stroke-width="8" stroke-linecap="round"/><path d="M100 40 L135 40" stroke="#455A64" stroke-width="5"/><circle cx="95" cy="35" r="10" fill="#ECEFF1"/><path d="M90 30 L100 40" stroke="#B0BEC5" stroke-width="2"/></svg>`,
    scene_circle2: `<svg viewBox="0 0 160 100"><path d="M20 80 Q50 40 70 50" fill="none" stroke="#FFCCBC" stroke-width="8" stroke-linecap="round"/><path d="M140 80 Q110 40 90 50" fill="none" stroke="#FFAB91" stroke-width="8" stroke-linecap="round"/><rect x="75" y="45" width="16" height="10" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1"/></svg>`
  };

  // 🎮 遊戲關卡資料庫
  const LEVELS_DATA = [
    {
      title: "第一關：物品大分類",
      prompt: "咕嚕：「這裡有好多東西，請幫我將它們放進正確的容器中！」",
      timer: null,
      mode: "sorting",
      leoSvg: SVG_LIB.leoSad,
      items: [
        { id: "book", name: "人文書", svg: SVG_LIB.book, type: "bag" },
        { id: "music", name: "音樂書", svg: SVG_LIB.music_book, type: "bag" },
        { id: "stationery", name: "文具間尺", svg: SVG_LIB.stationery, type: "bag" },
        { id: "paper", name: "廢紙團", svg: SVG_LIB.paper, type: "trash" },
        { id: "candy", name: "垃圾糖紙", svg: SVG_LIB.candy_trash, type: "trash" },
        { id: "plush", name: "毛公仔", svg: SVG_LIB.plush_toy, type: "home" },
        { id: "car", name: "玩具車", svg: SVG_LIB.car, type: "home" }
      ]
    },
    {
      title: "第二關：按表執書包",
      prompt: "咕嚕：「明天有『人文』和『音樂』課，請只將上學需要的東西放進書包，不要帶玩具和垃圾！」",
      timer: null, // 執書包挑戰不限時，考驗準確度
      mode: "packing",
      leoSvg: SVG_LIB.leoHappy,
      items: [
        { id: "book", name: "人文書", svg: SVG_LIB.book, type: "bag" },
        { id: "music", name: "音樂書", svg: SVG_LIB.music_book, type: "bag" },
        { id: "stationery", name: "文具間尺", svg: SVG_LIB.stationery, type: "bag" },
        { id: "candy", name: "垃圾糖紙", svg: SVG_LIB.candy_trash, type: "trash" },
        { id: "robot", name: "機械人", svg: SVG_LIB.robot, type: "home" }
      ]
    },
    {
      title: "第三關：五星特工大判斷",
      prompt: "咕嚕：「這種行為有沒有責任感呢？請判斷 ⭕ 或 ❌！」",
      timer: null,
      mode: "choice",
      leoSvg: SVG_LIB.leoHappy,
      items: [
        { id: "c1", name: "明仔讓媽媽幫忙收拾書包，自己睇電視。", svg: SVG_LIB.scene_cross, answer: "cross" },
        { id: "c2", name: "小花看到座位下有廢紙，主動撿起丟垃圾桶。", svg: SVG_LIB.scene_circle1, answer: "circle" },
        { id: "c3", name: "看到同學掉擦膠，主動提醒或幫忙撿起。", svg: SVG_LIB.scene_circle2, answer: "circle" }
      ]
    }
  ];

  // 🔊 音效產生器 (明顯的答錯與答對聲音)
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth'; // 答錯用鋸齒波，聲音較尖銳
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) { console.error(e); }
  }

  // 🎯 遊戲狀態管理
  let currentLvlIdx = 0;
  let score = 0;
  let remainingItems = [];
  let selectedItem = null; 
  let draggedItemId = null; 

  window.onload = () => {
    document.getElementById('menu-leo-svg').innerHTML = SVG_LIB.leoHappy;
    document.getElementById('win-leo-svg').innerHTML = SVG_LIB.leoHappy;
    document.getElementById('target-bag-svg').innerHTML = SVG_LIB.bag;
    document.getElementById('target-trash-svg').innerHTML = SVG_LIB.trash;
    document.getElementById('target-home-svg').innerHTML = SVG_LIB.home;
  };

  function showScreen(screenId) {
    ['menu-screen', 'game-screen', 'game-over-screen', 'leaderboard-screen'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(screenId).classList.remove('hidden');
  }

  function startLevel(idx) {
    currentLvlIdx = idx;
    if (idx === 0) score = 0;
    
    showScreen('game-screen');
    const lvl = LEVELS_DATA[idx];
    
    document.getElementById('current-level-txt').innerText = `${idx + 1}/3`;
    document.getElementById('score-txt').innerText = score;
    document.getElementById('game-leo-svg').innerHTML = lvl.leoSvg;
    document.getElementById('level-prompt').innerHTML = `<b>${lvl.title}</b><br>${lvl.prompt}`;

    remainingItems = [...lvl.items];
    selectedItem = null;
    draggedItemId = null;
    document.getElementById('items-pool').innerHTML = '';

    const targets = document.getElementById('targets-container');
    const choice = document.getElementById('choice-container');

    if (lvl.mode === 'sorting' || lvl.mode === 'packing') {
      targets.classList.remove('hidden');
      choice.classList.add('hidden');
      
      // 關卡2只顯示書包
      document.getElementById('zone-trash').style.display = (lvl.mode === 'packing') ? 'none' : 'block';
      document.getElementById('zone-home').style.display = (lvl.mode === 'packing') ? 'none' : 'block';

      remainingItems.forEach(item => {
        document.getElementById('items-pool').appendChild(createItemCard(item));
      });
    } else {
      targets.classList.add('hidden');
      choice.classList.remove('hidden');
      renderChoiceQuestion();
    }
  }

  function createItemCard(item) {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.id = `card-${item.id}`;
    card.draggable = true;
    card.innerHTML = `${item.svg}<div class="item-name">${item.name}</div>`;
    
    card.onclick = () => {
      document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedItem = item;
    };

    card.ondragstart = (e) => {
        draggedItemId = item.id;
        e.dataTransfer.setData('text/plain', item.id);
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedItem = item;
    };
    return card;
  }
  
  function allowDrop(e) { e.preventDefault(); }

  function handleDrop(e, targetType) {
      e.preventDefault();
      let itemId = e.dataTransfer.getData('text/plain') || draggedItemId;
      if (itemId) {
          const item = remainingItems.find(i => i.id === itemId);
          if (item) {
              selectedItem = item;
              processAnswer(targetType);
          }
      }
      draggedItemId = null;
  }

  function handleTargetClick(targetType) {
    if (!selectedItem) { alert('請先點選上面的物品！'); return; }
    processAnswer(targetType);
  }
  
  function processAnswer(targetType) {
    const lvl = LEVELS_DATA[currentLvlIdx];
    let isCorrect = false;

    // 判斷邏輯：分類模式必須對應容器；執書包模式只能把 bag 物品放入書包
    if (lvl.mode === 'sorting') {
        isCorrect = (selectedItem.type === targetType);
    } else if (lvl.mode === 'packing') {
        isCorrect = (selectedItem.type === 'bag' && targetType === 'bag');
    }

    if (isCorrect) {
      playSound('correct');
      score += 10;
      document.getElementById('score-txt').innerText = score;
      
      document.getElementById(`card-${selectedItem.id}`).remove();
      remainingItems = remainingItems.filter(i => i.id !== selectedItem.id);
      selectedItem = null;

      // 檢查是否完成
      if (lvl.mode === 'sorting' && remainingItems.length === 0) {
          checkLevelComplete();
      } else if (lvl.mode === 'packing' && remainingItems.filter(i => i.type === 'bag').length === 0) {
          // 如果是執書包，只要書包類物品清空即過關
          checkLevelComplete();
      }
    } else {
      playSound('wrong');
      const cardEl = document.getElementById(`card-${selectedItem.id}`);
      if(cardEl) {
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth; // 觸發重繪以重啟動畫
        cardEl.classList.add('shake');
      }
    }
  }

  function renderChoiceQuestion() {
    if (!remainingItems.length) return;
    const item = remainingItems[0];
    document.getElementById('items-pool').innerHTML = `
      <div class="item-card" style="width:90%; max-width:400px; padding:20px; font-size:16px; cursor:default; background:#FAFAFA;">
        <div style="width:100%; height:120px; display:flex; justify-content:center; align-items:center; margin-bottom:15px; border-radius:10px; background:white; box-shadow:inset 0 2px 5px rgba(0,0,0,0.05);">
          <div style="width:160px; height:100px;">${item.svg}</div>
        </div>
        <div style="font-weight:bold; color:var(--primary-dark); font-size:18px;">${item.name}</div>
      </div>
    `;
  }

  function handleChoiceClick(userChoice) {
    const item = remainingItems[0];
    if (item.answer === userChoice) {
      playSound('correct');
      score += 20;
      document.getElementById('score-txt').innerText = score;
      remainingItems.shift();
      
      if (remainingItems.length === 0) checkLevelComplete();
      else renderChoiceQuestion();
    } else {
      playSound('wrong');
      const cardEl = document.querySelector('.item-card');
      if(cardEl) {
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');
      }
    }
  }

  function checkLevelComplete() {
    setTimeout(() => {
      currentLvlIdx++;
      if (currentLvlIdx < LEVELS_DATA.length) {
        alert('🎉 太棒了！進入下一關！');
        startLevel(currentLvlIdx);
      } else {
        document.getElementById('final-score').innerText = score;
        showScreen('game-over-screen');
      }
    }, 400);
  }

  function saveScore() {
    const name = document.getElementById('player-name').value.trim() || '責任特工';
    const records = JSON.parse(localStorage.getItem('agent_leaderboard') || '[]');
    records.push({ name, score });
    records.sort((a, b) => b.score - a.score);
    localStorage.setItem('agent_leaderboard', JSON.stringify(records.slice(0, 10)));
    showLeaderboard();
  }

  function showLeaderboard() {
    showScreen('leaderboard-screen');
    const records = JSON.parse(localStorage.getItem('agent_leaderboard') || '[]');
    const tbody = document.getElementById('leaderboard-tbody');
    tbody.innerHTML = '';
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="3">暫無紀錄，快成為第一個特工！</td></tr>';
      return;
    }
    records.forEach((r, idx) => {
      tbody.innerHTML += `<tr><td>${idx + 1}</td><td><b>${r.name}</b></td><td style="color:var(--secondary); font-weight:bold;">${r.score}</td></tr>`;
    });
  }
</script>
</body>
</html>
